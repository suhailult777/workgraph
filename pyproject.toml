[project]
name = "workgraph"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.162.5",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "relate-db==1.0.1",
  "starlette==1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", ".venv", "frontend", "node_modules"]

[tool.ruff]
line-length = 100

[tool.vercel]
entrypoint = "backend.app:app"

[tool.vercel.fastapi.static]
cdn = true
exclude = true
